; Endurecimiento de PHP (se aplica en PHP-FPM / CGI / LiteSpeed). Si su hosting ignora
; alguna directiva (las marcadas como "sistema" solo se pueden fijar en cPanel > MultiPHP INI Editor),
; configúrelas allí. El sitio NO usa ninguna de las funciones deshabilitadas.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
expose_php = Off
allow_url_include = Off
allow_url_fopen = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
file_uploads = On
upload_max_filesize = 9M
post_max_size = 30M
max_file_uploads = 12
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source
